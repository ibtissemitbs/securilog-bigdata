name: securilog

services:
  mongodb:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    networks:
      - monitoring-net

  redis:
    image: redis:7.2-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - monitoring-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - monitoring-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.0
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      XPACK_MONITORING_ENABLED: "false"
    mem_limit: 1536m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ingest:/ingest:ro
      - ls_data:/usr/share/logstash/data
    networks:
      - monitoring-net

  webapp:
    build:
      context: ./webapp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ingest:/ingest
    networks:
      - monitoring-net

volumes:
  mongo_data:
  es_data:
  ingest:
  ls_data:

networks:
  monitoring-net:
    driver: bridge
