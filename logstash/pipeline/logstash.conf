input {
  file {
    path => "/ingest/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "securilog-test-%{+yyyy.MM.dd}"
    ilm_enabled => false
    data_stream => false
    manage_template => false
  }

  stdout {
    codec => rubydebug
  }
}
